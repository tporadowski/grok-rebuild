name: mid-text-btw-stays-on-the-main-turn
description: >
  A mid-message `/btw` token is one prompt on the main turn. The typed text
  is echoed, and the side-question title is not opened. 100 columns keep the
  echoed line from wrapping through the asserted prefix.
terminal:
  rows: 40
  cols: 100
environment:
  args: ["--trust"]
mock:
  response: "BTW_MAIN_TURN_DONE assistant reply after the typed mid-text /btw."
steps:
  - action: wait_for_text
    text: Quit
    timeout_ms: 20000
  - action: assert_not_contains
    text: panicked
  - action: focus_prompt
  - action: type_text
    text: "explain the controller. /btw what is a WBC_SIDE_Q"
  - action: wait_for_text
    text: "WBC_SIDE_Q"
    timeout_ms: 10000
  # `/btw` needs the session id; SessionCreated puts the model name on screen with it.
  - action: wait_for_text
    text: "test-model"
    timeout_ms: 10000
  - action: keys
    keys: "<Enter>"
  - action: wait_for_text
    text: "controller. /btw what"
    timeout_ms: 15000
  - action: wait_for_text
    text: BTW_MAIN_TURN_DONE
    timeout_ms: 30000
  - action: assert_not_contains
    text: "/btw explain the controller."
  - action: assert_request_contains
    text: WBC_SIDE_Q
  - action: assert_not_contains
    text: panicked
  - action: assert_running
  - action: screenshot
    name: main-turn-echo
    note: "The typed /btw stays in the main-turn echo. No side-question title."
