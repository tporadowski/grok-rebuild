name: Release binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "ci-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' crates/codegen/xai-grok-version/Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="ci-${GITHUB_RUN_ID}"
          fi
          case "$tag" in
            v*)
              prerelease=false
              title="grok-rebuild ${version}"
              ;;
            *)
              prerelease=true
              title="grok-rebuild ${version} (${tag})"
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          TITLE: ${{ steps.meta.outputs.title }}
        shell: bash
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          Unofficial builds of this fork's \`xai-grok-pager\`. These are not SpaceXSI's Grok Build binaries.

          The program's updater still downloads official Grok Build from https://x.ai/cli. Set \`[cli] auto_update = false\` before using one of these as a daily binary.

          Commit: ${GITHUB_SHA}
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            args=(release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "$notes")
            if [ "$PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi

  build:
    needs: release
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            protoc_zip: protoc-29.3-linux-x86_64.zip
            exe: ""
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            protoc_zip: protoc-29.3-linux-aarch_64.zip
            exe: ""
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            protoc_zip: protoc-29.3-win64.zip
            exe: ".exe"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            protoc_zip: protoc-29.3-osx-x86_64.zip
            exe: ""
          - runner: macos-15-intel
            target: aarch64-apple-darwin
            platform: macos-aarch64
            protoc_zip: protoc-29.3-osx-x86_64.zip
            exe: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get clean
          df -h /

      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /Library/Developer/CoreSimulator \
            "$HOME/Library/Developer/CoreSimulator" \
            "$HOME/Library/Developer/Xcode/iOS DeviceSupport" \
            /usr/local/lib/android \
            "${AGENT_TOOLSDIRECTORY:-$HOME/hostedtoolcache}" || true
          df -h /

      - name: Use the larger Windows disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path D:\) {
            "CARGO_TARGET_DIR=D:/cargo-target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          Get-PSDrive -PSProvider FileSystem

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${{ matrix.protoc_zip }}"
          python -c "import zipfile; zipfile.ZipFile(r'''$RUNNER_TEMP/protoc.zip''').extractall(r'''$RUNNER_TEMP/protoc''')"
          bin="$RUNNER_TEMP/protoc/bin/protoc${{ matrix.exe }}"
          chmod +x "$bin"
          echo "PROTOC=$bin" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Linux arm64 jemalloc page size
        if: matrix.platform == 'linux-aarch64'
        shell: bash
        run: |
          # 4 KB pages run on 4 KB and 64 KB kernels. The repo default of 64 KB
          # pages does not run on the usual 4 KB ARM machines.
          echo "AARCH64_UNKNOWN_LINUX_GNU_JEMALLOC_SYS_WITH_LG_PAGE=12" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail
          # `--release`, not `release-dist`. That profile is one codegen unit
          # with thin LTO, and the link does not fit these runners' RAM.
          cargo build --release --target "${{ matrix.target }}" -p xai-grok-pager-bin
          df -h /

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' crates/codegen/xai-grok-version/Cargo.toml | head -1)
          target_dir="${CARGO_TARGET_DIR:-target}"
          src="${target_dir}/${{ matrix.target }}/release/xai-grok-pager${{ matrix.exe }}"
          name="grok-rebuild-${version}-${{ matrix.platform }}${{ matrix.exe }}"
          cp "$src" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name" > "${name}.sha256"
          elif command -v shasum >/dev/null; then
            shasum -a 256 "$name" > "${name}.sha256"
          else
            hash=$(powershell.exe -NoProfile -Command "(Get-FileHash -Algorithm SHA256 '${name}').Hash.ToLower()")
            printf '%s  %s\n' "$hash" "$name" > "${name}.sha256"
          fi
          ls -lh "$name"
          gh release upload "$TAG" "$name" "${name}.sha256" --clobber
